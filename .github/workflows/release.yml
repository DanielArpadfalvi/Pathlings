name: Release

# Signed store builds (T9.3). Runs on version tags (v1.0.0 …) or by hand. Every signing and
# upload step only runs when its secrets exist, so the workflow stays green before the owner has
# set them up (it then produces unsigned builds). See docs/RELEASE.md for the secrets list.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      VERSION_CODE: ${{ github.run_number }}
      VITE_REVENUECAT_ANDROID_KEY: ${{ vars.REVENUECAT_ANDROID_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx cap sync android
      - name: Decode the upload keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build the release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: pathlings-android-release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload to Google Play (internal testing, draft)
        if: env.HAS_PLAY == 'true' && env.HAS_KEYSTORE == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.arpadfalvi.pathlings
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
      VITE_REVENUECAT_IOS_KEY: ${{ vars.REVENUECAT_IOS_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Unsigned build (no App Store Connect key yet)
        if: env.HAS_ASC != 'true'
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build
      - name: Archive and upload to App Store Connect (TestFlight)
        if: env.HAS_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 -d > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY"
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Pathlings.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" "${AUTH[@]}" archive
          cp ios/App/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Pathlings.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"
